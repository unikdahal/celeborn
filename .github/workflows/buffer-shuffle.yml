name: Buffer shuffle validation
on:
  push:
    branches: [feature/async-buffer-shuffle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Format and capture source formatting
        run: |
          build/mvn -B -Pspark-3.5 spotless:apply
          git diff > formatting.patch
          git diff --exit-code
      - name: Test public buffer contract
        run: |
          build/mvn -B -Pspark-3.5 -pl client -am test \
            -Dtest=BufferPushSuiteJ,ShuffleClientSuiteJ \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-java-${{ matrix.java }}
          path: |
            formatting.patch
            client/target/surefire-reports/**
            client/target/test-reports/**
      - name: Test client and shared transport
        run: |
          build/mvn -B -Pspark-3.5 -pl client -am test
      - name: Measure repeated framing and allocation
        if: matrix.java == 17
        run: |
          build/mvn -B -Pspark-3.5 -pl client -am install -DskipTests
          build/mvn -B -Pspark-3.5 -pl client dependency:build-classpath -Dmdep.outputFile=target/benchmark-classpath
          lscpu > benchmark-hardware.txt
          java -version 2> benchmark-java.txt
          for fork in 1 2 3; do
            java -Xms512m -Xmx512m -XX:+UseG1GC \
              -cp "client/target/test-classes:client/target/classes:$(cat client/target/benchmark-classpath)" \
              org.apache.celeborn.client.BufferPushBenchmark > "framing-benchmark-${fork}.jsonl"
          done
          python dev/buffer_push_report.py
          cat framing-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-java-${{ matrix.java }}
          path: |
            formatting.patch
            framing-benchmark-*.jsonl
            benchmark-*.txt
            framing-report.*
            **/target/surefire-reports/**
            **/target/test-reports/**
            **/target/unit-tests.log
