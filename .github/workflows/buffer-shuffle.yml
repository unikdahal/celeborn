name: Buffer shuffle validation
on:
  push:
    branches: [feature/async-buffer-shuffle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Format and capture source formatting
        run: |
          build/mvn -B -Pspark-3.5 spotless:apply
          git diff > formatting.patch
      - name: Test client and shared transport
        run: |
          build/mvn -B -Pspark-3.5 -pl client -am test \
            -Dtest=BufferPushSuiteJ,ShuffleClientSuiteJ \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-java-${{ matrix.java }}
          path: |
            formatting.patch
            **/target/surefire-reports/**
            **/target/test-reports/**
            **/target/unit-tests.log
