name: Caller-owned push validation

on:
  workflow_dispatch:
  push:
    branches:
      - ci/caller-owned-push

concurrency:
  group: caller-owned-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
          cache: maven
      - name: Spotless
        run: |
          build/mvn -B -q -Pgoogle-mirror,spark-3.5 spotless:apply
          git diff > format.patch
          cat format.patch
          test ! -s format.patch
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch

  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build
        run: build/mvn -B -Dspotless.check.skip=true -Pgoogle-mirror -pl worker -am install -DskipTests
      - name: Client unit tests
        run: |
          build/mvn -B -Dspotless.check.skip=true -Pgoogle-mirror -pl client test \
            -Dtest='ShuffleClientRawPushSuiteJ,PushDataBodyBufferSuiteJ,ShuffleClientPushLifecycleSuiteJ,ShuffleClientSuiteJ,DataPushQueueSuiteJ' \
            -DwildcardSuites=none -DfailIfNoTests=false
      - name: Repeat ownership tests x20
        if: success() || failure()
        run: |
          for i in $(seq 1 20); do
            build/mvn -B -q -Dspotless.check.skip=true -Pgoogle-mirror -pl client test \
              -Dtest='ShuffleClientRawPushSuiteJ,PushDataBodyBufferSuiteJ,ShuffleClientPushLifecycleSuiteJ' -DwildcardSuites=none -DfailIfNoTests=false
          done
      - name: Mini cluster read/write with hard splits
        if: success() || failure()
        run: |
          build/mvn -B -Dspotless.check.skip=true -Pgoogle-mirror -pl worker test -Dtest=none -DfailIfNoTests=false \
            -DwildcardSuites='org.apache.celeborn.service.deploy.cluster.RawPushDataReadWriteSuite,org.apache.celeborn.service.deploy.cluster.ClusterReadWriteTestWithNONE,org.apache.celeborn.service.deploy.cluster.ClusterReadWriteTestWithLZ4,org.apache.celeborn.service.deploy.cluster.ReadWriteTestWithFailures,org.apache.celeborn.service.deploy.cluster.PushMergedDataSplitSuite'
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/unit-tests.log

  cherry-pick-main:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: maven
      - name: Apply the feature commit to upstream main
        run: |
          git config user.name ci && git config user.email ci@example.com
          FEATURE=$(git log --format=%H -n 1 --grep='^Add a zero-copy push API for caller-owned buffers')
          git remote add upstream https://github.com/apache/celeborn.git
          git fetch -q upstream main
          git checkout -q -b on-main upstream/main
          git cherry-pick "$FEATURE"
          git log --oneline -2
      - name: Build and test on main
        run: |
          build/mvn -B -Dspotless.check.skip=true -Pgoogle-mirror -pl worker -am install -DskipTests
          build/mvn -B -Dspotless.check.skip=true -Pgoogle-mirror -pl client test \
            -Dtest='ShuffleClientRawPushSuiteJ,PushDataBodyBufferSuiteJ,ShuffleClientPushLifecycleSuiteJ,ShuffleClientSuiteJ' \
            -DwildcardSuites=none -DfailIfNoTests=false
          build/mvn -B -Dspotless.check.skip=true -Pgoogle-mirror -pl worker test -Dtest=none -DfailIfNoTests=false \
            -DwildcardSuites=org.apache.celeborn.service.deploy.cluster.RawPushDataReadWriteSuite

  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: maven
      - name: Build
        run: build/mvn -B -Dspotless.check.skip=true -Pgoogle-mirror -pl worker -am install -DskipTests
      - name: Run RawPushDataBenchmark
        run: |
          export MAVEN_OPTS="-Xmx6g --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true"
          CELEBORN_GENERATE_BENCHMARK_FILES=1 timeout 50m build/mvn -B -q -Dspotless.check.skip=true -Pgoogle-mirror -pl worker \
            org.codehaus.mojo:exec-maven-plugin:3.1.0:java \
            -Dexec.mainClass=org.apache.celeborn.service.deploy.cluster.RawPushDataBenchmark \
            -Dexec.classpathScope=test -Dexec.cleanupDaemonThreads=false 2>&1 | grep -v ' INFO \| DEBUG \| WARN ' | tee benchmark.log || true
          find . -name 'RawPushDataBenchmark*results.txt' -exec cat {} \; -exec cp {} . \;
      - uses: actions/upload-artifact@v4
        with:
          name: raw-push-benchmark
          path: |
            RawPushDataBenchmark-jdk17-results.txt
            benchmark.log

  part-one-alone:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ref: [feat/push-body-refcount, feat/push-body-refcount-main]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
          cache: maven
      - name: Build and test the first change on its own
        run: |
          git log --oneline -2
          build/mvn -B -Pgoogle-mirror -pl client -am install -DskipTests
          build/mvn -B -Pgoogle-mirror -pl client test \
            -Dtest='PushDataBodyBufferSuiteJ,ShuffleClientPushLifecycleSuiteJ,ShuffleClientSuiteJ,DataPushQueueSuiteJ' \
            -DwildcardSuites=none -DfailIfNoTests=false
          build/mvn -B -Pgoogle-mirror -pl worker -am install -DskipTests
          build/mvn -B -Pgoogle-mirror -pl worker test -Dtest=none -DfailIfNoTests=false \
            -DwildcardSuites='org.apache.celeborn.service.deploy.cluster.PushDataRetryLifecycleSuite,org.apache.celeborn.service.deploy.cluster.ClusterReadWriteTestWithNONE,org.apache.celeborn.service.deploy.cluster.ReadWriteTestWithFailures,org.apache.celeborn.service.deploy.cluster.PushMergedDataSplitSuite'

  push-path-ab:
    name: pushData(byte[]) A/B against the unmodified base
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: branch-0.7-baseline
          path: base
      - uses: actions/checkout@v4
        with:
          ref: feat/push-body-refcount
          path: pr
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: maven
      - name: Build both
        run: |
          for v in base pr; do
            cp ci/dev/ci/PushDataPathBenchmark.scala $v/worker/src/test/scala/org/apache/celeborn/service/deploy/cluster/
            (cd $v && git log --oneline -1 && build/mvn -B -q -Dspotless.check.skip=true -Pgoogle-mirror -pl worker -am install -DskipTests)
          done
      - name: Interleaved runs
        run: |
          export MAVEN_OPTS="-Xmx6g --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true"
          for round in 1 2 3 4 5; do
            for v in base pr; do
              if [ $((round % 2)) -eq 0 ]; then v=$([ $v = base ] && echo pr || echo base); fi
              (cd $v && build/mvn -B -q -Dspotless.check.skip=true -Pgoogle-mirror -pl client install -DskipTests)
              (cd $v && build/mvn -B -q -Dspotless.check.skip=true -Pgoogle-mirror -pl worker \
                org.codehaus.mojo:exec-maven-plugin:3.1.0:java -Dexec.classpathScope=test \
                -Dexec.mainClass=org.apache.celeborn.service.deploy.cluster.PushDataPathBenchmark \
                -Dexec.args=$v -Dexec.cleanupDaemonThreads=false 2>&1 | grep '^RESULT' | tee -a results.txt) || true
            done
          done
          mv base/results.txt base-results.txt 2>/dev/null || true; mv pr/results.txt pr-results.txt 2>/dev/null || true
          cat base-results.txt pr-results.txt > all.txt
          python3 - <<'PY'
          import statistics, collections
          rows = collections.defaultdict(list)
          for line in open("all.txt"):
              _, label, size, wall, cpu, alloc = line.split()
              rows[(int(size), label)].append((float(wall), float(cpu), float(alloc)))
          print("| batch KiB | version | runs | wall ms (median) | process CPU ms (median) | allocated MiB (median) |")
          print("|---|---|---|---|---|---|")
          for (size, label) in sorted(rows):
              r = rows[(size, label)]
              med = [statistics.median(x[i] for x in r) for i in range(3)]
              print(f"| {size} | {label} | {len(r)} | {med[0]:.1f} | {med[1]:.1f} | {med[2]:.1f} |")
          PY
